name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 para acompanhar o Dockerfile, que é como o site é buildado.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      # `npm run build` é `tsc -b && vite build` — o type-check acontece aqui.
      - name: Build
        run: npm run build
