# =============================================================================
# redist-web — orquestração Docker (tier web: SPA + BFF)
# -----------------------------------------------------------------------------
#   web  Caddy: serve a SPA estática e roteia /api,/auth para a BFF (+ HTTPS)
#   bff  redist-bff: guarda o ApiToken e a sessão (cookie httpOnly), faz proxy
#        para a API redist-server (que roda numa stack separada).
#
# Variáveis vêm do ambiente / de um ./.env (interpolação ${...}). Ver .env.example.
# A BFF é buildada a partir do repositório irmão ../redist-bff.
# =============================================================================

services:
  bff:
    build:
      context: ../redist-bff
      dockerfile: Dockerfile
    image: redist-bff:latest
    restart: unless-stopped
    init: true
    environment:
      PORT: 3001
      # Onde está a API redist-server. No Mac/Windows, host.docker.internal
      # alcança a stack do redist-server publicada no host (Caddy na porta 80).
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal}
      # MESMO valor do API_TOKEN do redist-server (segredo de servidor).
      API_TOKEN: ${API_TOKEN:-}
      # true só atrás de HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Chave publicável do Stripe (pk_test_.../pk_live_...), repassada ao
      # front via GET /auth/config. Segura de expor; a secreta fica no redist-server.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose:
      - '3001'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: redist-web:latest
    restart: unless-stopped
    depends_on:
      - bff
    ports:
      # Porta do host parametrizável (evita conflito com outras stacks locais).
      - '${WEB_HTTP_PORT:-80}:80'
      - '${WEB_HTTPS_PORT:-443}:443'
      - '${WEB_HTTPS_PORT:-443}:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
